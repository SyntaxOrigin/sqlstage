name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kalite:
    name: derle, test, clippy, fmt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Biçim denetimi
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Testler
        run: cargo test
      - name: Salt okunur (release) sürüm
        run: cargo build --release
